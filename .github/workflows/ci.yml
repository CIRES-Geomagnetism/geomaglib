name: geomaglib test numpy version ci/cd

on:
  push:
    branches: ["python314"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Node.js 20 was deprecated. To enusure that actions/checkout@v4 and actions/setup-python@v4 can run as expected,
  # we force to use Node.js 24. Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Tests
      run: |
        python -m unittest discover -s tests

